  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono for Code -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #030712;
      --card-bg: rgba(17, 24, 39, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --gradient-accent: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      --code-bg: #0b1329;
    }

    * {
      box-sizing: border-box;
      scroll-behavior: smooth;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 65%, rgba(129, 140, 248, 0.08) 0%, transparent 40%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      width: min(1100px, 90%);
      margin: auto;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(3, 7, 18, 0.75);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
    }

    nav {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-weight: 800;
      font-size: 22px;
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .navlinks {
      display: flex;
      gap: 24px;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .navlinks a:hover {
      color: var(--accent);
      transition: color 0.3s ease;
    }

    /* Live Status Badge */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.25);
      color: #4ade80;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    /* Hero Section */
    .hero {
      padding: 80px 0 60px;
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      align-items: center;
      gap: 40px;
    }

    h1 {
      font-size: clamp(38px, 5.5vw, 60px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -1.5px;
      margin-bottom: 18px;
    }

    h1 span {
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .lead {
      color: var(--text-muted);
      font-size: 18px;
      max-width: 580px;
    }

    .actions {
      display: flex;
      gap: 16px;
      margin-top: 32px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.3s ease;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-main);
    }

    .btn:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn.primary {
      background: var(--gradient-accent);
      color: #000;
      border: none;
      font-weight: 700;
      box-shadow: 0 8px 25px var(--accent-glow);
    }

    .btn.primary:hover {
      box-shadow: 0 12px 30px rgba(56, 189, 248, 0.4);
    }

    /* Terminal Widget (Zuckerberg Style) */
    .terminal-card {
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      font-family: 'JetBrains Mono', monospace;
    }

    .terminal-header {
      background: rgba(255, 255, 255, 0.03);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--card-border);
    }

    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }

      font-size: 13
